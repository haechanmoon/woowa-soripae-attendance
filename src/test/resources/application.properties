# 테스트 전용 설정. 이 파일이 없으면 @SpringBootTest가 main의 application.properties를 그대로 읽어
# 로컬 개발 MySQL(soripae_attendance)에 붙고, 부팅하면서 Flyway 마이그레이션까지 실행해버린다.
# 실제로 2026-07-27에 V6가 `./gradlew test`만으로 로컬 DB에 적용됐다. 파괴적인 마이그레이션이었다면
# 테스트를 돌린 것만으로 진짜 데이터가 지워졌을 상황이라, 테스트를 실제 DB에서 완전히 떼어낸다.

# 매번 새로 만들어지고 JVM이 끝나면 사라지는 인메모리 DB. 어떤 실제 DB에도 닿지 않는다.
spring.datasource.url=jdbc:h2:mem:soripae_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 스키마는 엔티티에서 만든다. 마이그레이션 SQL은 MySQL 전용 문법(ENGINE=InnoDB, DELETE ... JOIN)이라
# H2에서 그대로 돌지 않고, 여기서 검증할 대상도 아니다. 스키마와 엔티티가 맞는지는 앱이 실제로 뜰 때
# ddl-auto=validate가 로컬/EC2 양쪽에서 잡아준다.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
